<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <title>反着来 - 看到什么，做相反的</title>
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 20%, rgba(0, 255, 157, 0.07), transparent 32rem),
        #090b0a;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      font-family: "Alibaba PuHuiTi", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .game-shell {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      flex: 0 0 auto;
      max-width: 100%;
      max-height: 100%;
      background: #0f0f0f;
      border: 1px solid rgba(0, 255, 157, 0.06);
      border-radius: 24px;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.45),
        0 0 48px rgba(0, 255, 157, 0.05);
      touch-action: none;
      image-rendering: auto;
    }
    .fallback {
      max-width: 28rem;
      padding: 1.5rem;
      color: #b3b3b3;
      line-height: 1.6;
      text-align: center;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 520px), (max-height: 460px) {
      body { padding: 0; }
      canvas {
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
    /* 加载画面 */
    #loading {
      position: fixed; top:0; left:0; right:0; botom:0;
      background: #0A0A0A;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 9999;
      transition: opacity 0.6s;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }
    #loading h1 {
      color: #00FF9D; font-size: 48px; font-weight: 900;
      text-shadow: 0 0 20px rgba(0,255,157,0.5), 0 0 40px rgba(0,255,157,0.2);
      margin-bottom: 16px;
    }
    #loading .sub { color: #666; font-size: 14px; }
    #loading .dot-anim::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%  { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }
  </style>
</head>
<body>

  <div id="loading">
    <h1>反 着 来</h1>
    <div class="sub">正在连接服务器<span class="dot-anim"></span></div>
  </div>

  <main id="gameShell" class="game-shell">
    <canvas
      id="gameCanvas"
      tabindex="0"
      role="application"
      aria-describedby="gameInstructions"
      aria-label="反着来游戏画面"
    >
      <p class="fallback">当前浏览器不支持 Canvas，无法运行《反着来》。请升级浏览器后重试。</p>
    </canvas>
    <p id="gameInstructions" class="sr-only">
      根据屏幕提示做出相反操作。方向题可滑动或使用左右方向键，按钮题可点击或使用数字键。
    </p>
  </main>

  <noscript>
    <p class="fallback">《反着来》需要启用 JavaScript 才能运行。</p>
  </noscript>

  <script src="/api-client.js?v=10"></script>
  <script src="/questions.js?v=10"></script>
  <script src="/game.js?v=10"></script>
</body>
</html>
